<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号管理</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 560px; margin: 0 auto; }
    .card {
      background: #fff; border-radius: 16px; padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    h1 { font-size: 20px; color: #1e3c72; margin-bottom: 16px; }
    .list { list-style: none; }
    .list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 8px; border-bottom: 1px solid #f0f0f0; gap: 8px;
    }
    .info { flex: 1; min-width: 0; }
    .nick { font-size: 15px; font-weight: 600; color: #333; }
    .uid { font-size: 12px; color: #999; margin-top: 2px; word-break: break-all; }
    .tag { font-size: 12px; color: #16a34a; }
    button {
      border: none; border-radius: 6px; padding: 7px 14px;
      font-size: 13px; cursor: pointer; background: #1e3c72; color: #fff;
    }
    button.ghost { background: #eee; color: #555; }
    button.danger { background: #fff; color: #dc2626; border: 1px solid #fecaca; }
    button:hover { opacity: .9; }
    .actions { display: flex; gap: 8px; }
    .toolbar { margin-top: 16px; display: flex; gap: 10px; justify-content: space-between; }
    .toolbar a { color: #2a5298; text-decoration: none; font-size: 14px; }
    .empty { text-align: center; color: #999; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>账号管理</h1>
      <ul class="list" id="list">
        <li class="empty">加载中…</li>
      </ul>
      <div class="toolbar">
        <a href="./login_qr.html">＋ 扫码添加账号</a>
        <a href="./login_captcha_simulate.html">账号密码登录</a>
        <a href="./">← 返回首页</a>
      </div>
    </div>
  </div>

  <script>
    async function load() {
      const ul = document.getElementById('list');
      try {
        const r = await fetch('/account/list').then((res) => res.json());
        const accounts = (r && r.accounts) || [];
        if (!accounts.length) {
          ul.innerHTML = '<li class="empty">还没有保存的账号，先去登录一个</li>';
          return;
        }
        ul.innerHTML = '';
        accounts.forEach((a) => {
          const li = document.createElement('li');
          const info = document.createElement('div');
          info.className = 'info';
          info.innerHTML =
            '<div class="nick">' + (a.nickname || '未命名') + (a.isActive ? ' <span class="tag">● 当前</span>' : '') + '</div>' +
            '<div class="uid">userid: ' + a.userid + ' · token …' + (a.tokenTail || '') + '</div>';
          const actions = document.createElement('div');
          actions.className = 'actions';
          if (!a.isActive) {
            const sw = document.createElement('button');
            sw.textContent = '切换';
            sw.onclick = async () => {
              await fetch('/account/switch?userid=' + encodeURIComponent(a.userid)).then((r) => r.json());
              load();
            };
            actions.appendChild(sw);
          }
          const del = document.createElement('button');
          del.textContent = '删除';
          del.className = 'danger';
          del.onclick = async () => {
            if (!confirm('删除账号 ' + (a.nickname || a.userid) + ' ?')) return;
            await fetch('/account/del?userid=' + encodeURIComponent(a.userid)).then((r) => r.json());
            load();
          };
          actions.appendChild(del);
          li.appendChild(info);
          li.appendChild(actions);
          ul.appendChild(li);
        });
      } catch (e) {
        ul.innerHTML = '<li class="empty">加载失败：' + e.message + '</li>';
      }
    }
    load();
  </script>
</body>
</html>
