<!DOCTYPE html>
<html lang="zh-CN" data-theme="pink">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>酷狗音乐 · 豪华版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--card:rgba(255,255,255,.04);--glass:rgba(255,255,255,.06);--border:rgba(255,255,255,.08);--text:#f0f0f0;--text2:#888;--green:#1db954;--gold:#ffd700;--pink:#fd79a8;--purple:#6c5ce7}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes eqb{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.3)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
canvas#viz{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:100;backdrop-filter:blur(30px);background:rgba(10,10,18,.7);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}.logo i{font-size:24px}
.sbox{flex:1;max-width:400px;position:relative}
.sinp{width:100%;padding:10px 16px 10px 40px;border-radius:24px;border:1px solid var(--border);background:var(--glass);color:#fff;font-size:14px;outline:none}
.sinp:focus{border-color:var(--green);box-shadow:0 0 0 2px rgba(29,185,84,.2)}
.sico{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
.sbtn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--green);color:#fff;border:none;border-radius:20px;padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600}
.hdr-r{display:flex;align-items:center;gap:10px;margin-left:auto}
.btn{padding:7px 14px;border:none;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600;display:flex;align-items:center;gap:5px;transition:all .2s}
.btn-g{background:rgba(255,255,255,.12);color:#fff;border:1px solid var(--border)}.btn-gold{background:linear-gradient(135deg,#ffd700,#ffed4e);color:#333}
.u-box{display:flex;align-items:center;gap:8px;background:var(--glass);padding:4px 12px 4px 4px;border-radius:18px}
.u-av{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:14px}
.vip-chip{background:linear-gradient(135deg,#ffd700,#ffed4e);color:#333;padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700}
.tabs{display:flex;gap:4px;padding:8px 20px;background:rgba(10,10,18,.5);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:8px 16px;border-radius:16px;border:none;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;transition:all .2s}
.tab.active{background:var(--green);color:#fff}.tab:hover:not(.active){background:var(--glass);color:var(--text)}
.content{flex:1;padding:16px 20px;overflow-y:auto;padding-bottom:180px}
.panel{display:none}.panel.active{display:block}
.slist{display:flex;flex-direction:column;gap:6px}
.sitem{display:grid;grid-template-columns:40px 48px 1fr auto;gap:10px;align-items:center;padding:10px 14px;background:var(--glass);border:1px solid transparent;border-radius:10px;cursor:pointer;transition:all .2s}
.sitem:hover{background:rgba(255,255,255,.08);border-color:var(--border);transform:translateX(2px)}
.sitem.play{background:rgba(29,185,84,.12);border-color:var(--green)}
.sidx{text-align:center;color:var(--text2);font-size:13px;position:relative}
.eq{display:none;align-items:flex-end;gap:1px;height:14px}.eq i{width:2px;background:var(--green);border-radius:1px;animation:eqb .8s ease-in-out infinite}.eq i:nth-child(1){animation-delay:0s;height:5px}.eq i:nth-child(2){animation-delay:.15s;height:10px}.eq i:nth-child(3){animation-delay:.3s;height:7px}
.sitem.play .eq{display:flex!important}.sitem.play .num{display:none!important}
.scov{width:48px;height:48px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
.scov img{width:100%;height:100%;object-fit:cover}
.snfo{min-width:0}.snm{font-weight:600;font-size:13px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sar{color:var(--text2);font-size:11px}
.sbdg{display:flex;gap:3px}
.badge{padding:2px 6px;border-radius:4px;font-size:9px;font-weight:700;cursor:pointer;transition:transform .15s}
.badge:hover{transform:scale(1.15)}
.badge.flac{background:linear-gradient(135deg,#ffd700,#ffed4e);color:#333}
.badge.hq{background:var(--green);color:#fff}
.badge.new{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;animation:pulse 1.5s infinite}
.badge.flame{background:linear-gradient(135deg,#ff4500,#ff6347);color:#fff}
.badge.blast{background:linear-gradient(135deg,#ff006e,#ff4500);color:#fff}
.sact{display:flex;gap:4px}
.ibtn{width:32px;height:32px;border:none;border-radius:50%;background:var(--card);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.ibtn:hover{background:var(--green);transform:scale(1.1)}.ibtn.fav{color:var(--pink)}.ibtn.fav.on{background:var(--pink)}
.empty{text-align:center;padding:60px 20px}.empty-i{font-size:60px;margin-bottom:12px}.empty-t{color:var(--text2);font-size:14px}
.rec-header{margin-bottom:20px}.rec-title{font-size:18px;font-weight:700;margin-bottom:4px}.rec-desc{color:var(--text2);font-size:13px}
.rec-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.rec-tag{padding:4px 12px;border-radius:16px;background:var(--glass);border:1px solid var(--border);font-size:11px;color:var(--text2)}
.rec-tag.active{background:rgba(29,185,84,.15);border-color:var(--green);color:var(--green)}
.hitem{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--glass);border-radius:8px;margin-bottom:6px}
.hidx{font-size:12px;color:var(--text2);min-width:24px;text-align:center}
.hinfo{flex:1;min-width:0}.hnm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.har{font-size:11px;color:var(--text2)}
.htime{font-size:11px;color:var(--text2)}
.player{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,18,.92);backdrop-filter:blur(40px);border-top:1px solid var(--border);z-index:200}
.pbar-wrap{height:3px;background:rgba(255,255,255,.08);cursor:pointer;transition:height .15s}
.player:hover .pbar-wrap{height:5px}
.pbar{height:100%;background:linear-gradient(90deg,var(--green),var(--purple));border-radius:2px;width:0%;transition:width .1s linear}
.pmin{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:10px 20px}
.pinfo{display:flex;align-items:center;gap:10px;cursor:pointer}
.pcov{width:44px;height:44px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;animation:spin 20s linear infinite paused}
.pcov.on{animation-play-state:running}.pcov img{width:100%;height:100%;object-fit:cover}
.pnm{font-size:12px;font-weight:600;max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.par{font-size:10px;color:var(--text2)}
.pctrl{display:flex;align-items:center;gap:14px}
.cb{width:32px;height:32px;border:none;border-radius:50%;background:transparent;color:#fff;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}.cb:hover{transform:scale(1.1)}
.pb{width:38px;height:38px;background:#fff;color:#121212;font-size:18px}.pb:hover{box-shadow:0 4px 12px rgba(255,255,255,.3)}
.pex{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.full-player{display:none;position:fixed;inset:0;z-index:300;background:rgba(10,10,18,.97);backdrop-filter:blur(60px);flex-direction:column}
.full-player.on{display:flex}
.fp-close{position:absolute;top:16px;right:16px;z-index:10;width:40px;height:40px;border:none;border-radius:50%;background:var(--glass);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.fp-close:hover{background:rgba(255,255,255,.15)}
.fp-content{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:0;overflow:hidden}
.fp-left{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;position:relative}
.fp-cover{width:280px;height:280px;border-radius:20px;background:linear-gradient(135deg,var(--purple),var(--pink));display:flex;align-items:center;justify-content:center;font-size:80px;overflow:hidden;animation:spin 30s linear infinite paused;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.fp-cover.on{animation-play-state:running}.fp-cover img{width:100%;height:100%;object-fit:cover}
.fp-viz-wrap{position:absolute;top:16px;left:16px;right:16px;height:100px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.5);display:none;backdrop-filter:blur(8px)}
.fp-viz-wrap.on{display:block}
.fp-viz{width:100%;height:100%}
.viz-toggle{position:absolute;top:16px;right:16px;width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
.viz-toggle:hover{background:rgba(255,255,255,.2)}
.viz-toggle.on{background:var(--purple)}
.fp-song{text-align:center;margin-top:24px}.fp-song .snm{font-size:20px;font-weight:700;margin-bottom:4px}.fp-song .sar{font-size:14px;color:var(--text2)}
.fp-right{padding:40px;overflow-y:auto;max-height:500px;display:flex;flex-direction:column;justify-content:center;position:relative;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%)}
.lyric-line{font-size:16px;line-height:2.1;color:var(--text2);text-align:center;position:relative;font-weight:400;transform-origin:center;transition:opacity .5s cubic-bezier(.22,.61,.36,1),transform .5s cubic-bezier(.22,.61,.36,1),color .4s}
.lyric-line.active{font-size:21px;font-weight:650;background:linear-gradient(90deg,#6c5ce7,#fd79a8,#fdcb6e,#1db954,#6c5ce7);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-shadow:none;filter:drop-shadow(0 0 10px rgba(108,92,231,.35));transform:scale(1.06);opacity:1;letter-spacing:.5px}
#fpLyric{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 10%,#000 88%,transparent 100%)}
#fpLyric::-webkit-scrollbar{width:4px}#fpLyric::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@keyframes lyricGlow{0%{background-position:0% center}100%{background-position:200% center}}
.lyric-line.past{color:rgba(255,255,255,.22);font-size:14.5px;transform:scale(.97);opacity:.75;letter-spacing:0}
.lyric-line.future{color:var(--text2);font-size:16px;opacity:.55;transform:scale(1)}
.fp-right::-webkit-scrollbar{width:4px}
.fp-right::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.fp-progress{padding:20px 40px}
.fp-bar-wrap{height:4px;background:rgba(255,255,255,.08);border-radius:2px;cursor:pointer}
.fp-bar-wrap:hover .fp-bar{height:6px;margin-top:-1px}
.fp-bar{height:100%;background:linear-gradient(90deg,var(--green),var(--purple));border-radius:2px;width:0%;transition:width .1s linear}
.fp-times{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--text2)}
.fp-ctrls{display:flex;align-items:center;justify-content:center;gap:20px;padding:10px 40px 30px}
@media(max-width:768px){.hdr{padding:10px 14px}.sbox{max-width:100%}.hdr-r .btn span:last-child{display:none}.fp-content{grid-template-columns:1fr!important}.fp-left{padding-top:60px;padding-bottom:16px}.fp-right{max-height:none;padding:16px}.fp-cover{width:160px;height:160px;font-size:40px}.fp-viz-wrap{position:relative;top:auto;left:auto;right:auto;height:60px;margin-top:8px;border-radius:8px}.viz-toggle{top:8px;right:8px;width:30px;height:30px;font-size:14px}.fp-close{top:8px;right:44px}.fp-song{margin-top:8px}.fp-song .snm{font-size:15px}.fp-right .lyric-line{font-size:13px;line-height:1.8}.fp-right .lyric-line.active{font-size:15px}.content{padding:12px 14px;padding-bottom:180px}}
@media(min-width:769px) and (max-width:1024px){.fp-cover{width:220px;height:220px;font-size:60px}.fp-viz-wrap{height:70px}.fp-right{max-height:350px}.fp-close{top:12px;right:16px}.viz-toggle{top:12px;right:60px}}

/* ========== 🌸 少女甜心主题（覆盖层） ========== */
:root{
  --bg:#1a1026; --bg2:#2c1b3f;
  --card:rgba(255,255,255,.07); --glass:rgba(255,255,255,.075); --border:rgba(255,255,255,.14);
  --text:#fff3f8; --text2:#bfa9c2;
  --pink:#ff8fc4; --deep:#ff5fa3; --purple:#b78bfa; --mint:#8ef0dc;
  --grad:linear-gradient(135deg,#ff8fc4,#b78bfa);
  --grad2:linear-gradient(135deg,#ff5fa6,#a78bfa,#ff9fc9);
  --glow:0 10px 30px rgba(255,95,166,.35);
}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-3%,4%) scale(1.08)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}25%{transform:scale(1.18)}60%{transform:scale(1)}}
body{font-family:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;background:linear-gradient(160deg,#1a1026,#241633 45%,#2c1b3f);background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:
  radial-gradient(1.5px 1.5px at 30px 40px,rgba(255,255,255,.65),transparent 70%),radial-gradient(1px 1px at 90px 120px,rgba(255,220,245,.8),transparent 70%),radial-gradient(2px 2px at 160px 70px,rgba(183,139,250,.7),transparent 70%),radial-gradient(1px 1px at 220px 170px,rgba(255,143,196,.8),transparent 70%),radial-gradient(1.5px 1.5px at 50px 230px,rgba(255,255,255,.5),transparent 70%);
  background-size:260px 260px;opacity:.55;animation:twinkle 4s ease-in-out infinite}
body::after{content:'';position:fixed;inset:-20%;z-index:0;pointer-events:none;background:
  radial-gradient(38% 38% at 18% 22%,rgba(255,95,163,.28),transparent 62%),
  radial-gradient(36% 36% at 82% 26%,rgba(183,139,250,.30),transparent 62%),
  radial-gradient(46% 46% at 62% 86%,rgba(142,240,220,.16),transparent 62%);
  animation:pop 16s ease-in-out infinite alternate}

<script>
const $=id=>document.getElementById(id);
const S={songs:[],idx:-1,playing:false,logged:false,favs:[],lyric:[],vizRunning:false,particles:[],quality:'auto'};
const aud=$('aud');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');$('p-'+t.dataset.tab).classList.add('active');
  if(t.dataset.tab==='recommend')loadRecommend();
  if(t.dataset.tab==='favorites')loadFavorites();
  if(t.dataset.tab==='history')loadHistory();
});
async function api(u){return(await fetch(u)).json()}
async function post(u,b,r){return(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:r?'':JSON.stringify(b||{})})).json()}
function toast(m,t='info'){const e=document.createElement('div');e.style.cssText='position:fixed;top:16px;right:16px;z-index:9999;padding:12px 18px;border-radius:10px;font-size:13px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.6);animation:slideIn .3s;line-height:1.5';e.style.background=t==='ok'?'linear-gradient(135deg,#00b894,#00cec9)':t==='err'?'linear-gradient(135deg,#e17055,#d63031)':'linear-gradient(135deg,#0984e3,#6c5ce7)';e.textContent=m;document.body.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(()=>e.remove(),300)},4000)}
function fmt(s){if(!s||isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
async function search(kw){
  if(!kw)return;$('p-search').innerHTML='<div style="text-align:center;padding:40px;color:var(--text2)"><div style="width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 10px"></div>搜索中...</div>';
  try{const r=await api('/api/search?keyword='+encodeURIComponent(kw)+'&pagesize=50');if(r.data?.length){S.songs=r.data;renderSongs(r.data,$('p-search'))}else{$('p-search').innerHTML='<div class="empty"><div class="empty-i">😕</div><div class="empty-t">'+(r.error||'未找到')+'</div></div>'}}catch(e){toast('搜索失败','err')}
}
function renderSongs(songs,container){

let audioCtx,analyser,vizCtx;
function initViz(){
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;const src=audioCtx.createMediaElementSource(aud);src.connect(analyser);analyser.connect(audioCtx.destination)}
  if(!S.vizRunning){const c=$('viz');c.width=innerWidth;c.height=innerHeight;vizCtx=c.getContext('2d');S.vizRunning=true;vizLoop()}
}
function vizLoop(){
  if(!S.vizRunning)return;requestAnimationFrame(vizLoop);
  const bufLen=analyser.frequencyBinCount;const data=new Uint8Array(bufLen);analyser.getByteFrequencyData(data);
  // 背景画布：柔和光晕 + 底部优雅频谱条（iOS 风格）
  const W=innerWidth,H=innerHeight;const gctx=vizCtx;
  gctx.fillStyle='rgba(9,11,18,.13)';gctx.fillRect(0,0,W,H);
  const macC=document.documentElement.dataset.theme==='mac';
  const cols=macC?[[184,229,255],[96,200,255],[10,132,255],[122,146,255],[150,92,255]]:[[255,193,219],[255,143,197],[255,95,166],[227,117,255],[164,145,255]];
  const rgbaC=function(c){return 'rgba('+c[0]+','+c[1]+','+c[2]+','};
  let sumEn=0;for(var ei=0;ei<data.length;ei++){sumEn+=data[ei]}const en=sumEn/Math.max(1,data.length)/255;
  const gg=gctx.createRadialGradient(W/2,H*.46,0,W/2,H*.46,Math.max(W,H)*.6);
  gg.addColorStop(0,rgbaC(cols[Math.floor(cols.length/2)])+(0.05+0.16*en)+')');
  gg.addColorStop(.72,rgbaC(cols[cols.length-1])+'.045)');
  gg.addColorStop(1,'rgba(0,0,0,0)');
  gctx.fillStyle=gg;gctx.fillRect(0,0,W,H);
  const nB=Math.max(24,Math.min(64,Math.floor(W/16))),bbw=W/nB,baseH=H*.16;let xb=0;
  for(let bi=0;bi<nB;bi++){
    const di=Math.floor((bi+.5)/nB*(data.length*.72));
    const v=data[di]/255;const hb2=Math.max(1.4,v*v*baseH*2.2);
    const ci=Math.min(cols.length-1,Math.round(bi/(nB-1)*(cols.length-1)));const cc=cols[ci];
    gctx.globalAlpha=.9;gctx.fillStyle=rgbaC(cc)+'.8)';gctx.fillRect(xb,H-hb2,bbw-2,hb2);
    gctx.globalAlpha=.3;gctx.fillStyle=rgbaC(cc)+'1)';gctx.fillRect(xb,H-hb2,bbw-2,Math.min(2.6,hb2));
    gctx.globalAlpha=1;xb+=bbw;
  }
  // 播放器频谱：对称圆角条，iOS 风格
  const fpC=$('fpViz');
  if(fpC){
    const fpWrap=$('fpVizWrap');
    const show=fpWrap&&fpWrap.classList.contains('on');
    if(show){if(fpC.width!==fpWrap.offsetWidth||fpC.height!==fpWrap.offsetHeight){fpC.width=fpWrap.offsetWidth;fpC.height=fpWrap.offsetHeight}}
    else if(fpC.width!==300||fpC.height!==56){fpC.width=300;fpC.height=56}
    const fctx=fpC.getContext('2d');const fw=fpC.width,fh=fpC.height;fctx.clearRect(0,0,fw,fh);
    if(show){
      const fb=34,fcell=fw/Math.max(1,fb),fbw2=Math.max(2,fcell*.42);
      for(let k=0;k<fb;k++){
        const di2=Math.floor(k/fb*data.length*.72);
        const fv=data[di2]/255;const fhb=Math.min(fh*.9,Math.max(0,fv*fv*(fh*.88)));
        if(fhb<1)continue;
        const ci=Math.min(cols.length-1,Math.round(k/(fb-1)*(cols.length-1)));const cc=cols[ci];
        const xl=k*fcell+(fcell-fbw2)/2;const xr=fw-(k+1)*fcell+(fcell-fbw2)/2;
        fctx.globalAlpha=.9;fctx.fillStyle=rgbaC(cc)+'.85)';
        fctx.beginPath();fctx.arc(xl+fbw2/2,fh-fhb,fbw2/2,Math.PI,Math.PI*2);fctx.lineTo(xl+fbw2,fh);fctx.lineTo(xl,fh);fctx.closePath();fctx.fill();
        fctx.beginPath();fctx.arc(xr+fbw2/2,fh-fhb,fbw2/2,Math.PI,Math.PI*2);fctx.lineTo(xr+fbw2,fh);fctx.lineTo(xr,fh);fctx.closePath();fctx.fill();
        fctx.globalAlpha=.25;fctx.fillRect(xl,fh-fhb,fbw2,Math.min(2.2,fhb));fctx.fillRect(xr,fh-fhb,fbw2,Math.min(2.2,fhb));
        fctx.globalAlpha=1;
      }
    }
  }

function parseCookiesText(t){t=t.trim();if(t[0]==='{'){try{return JSON.parse(t)}catch{return null}}const out={};t.split(/[\n;]+/).forEach(p=>{const i=p.indexOf('=');if(i>0){const k=p.slice(0,i).trim(),v=p.slice(i+1).trim();if(k&&v)out[k]=v}});return out}
$('ckSubmit').onclick=async()=>{const obj=parseCookiesText($('ckInput').value);if(!obj||(!obj.token&&!obj.t)){toast('无法解析，请检查格式','err');return}const body={token:obj.token||obj.t||obj.jsessionid,userid:obj.userid||obj.uid||obj.kid,dfid:obj.dfid||'',t1:obj.t1||'',vip_type:obj.vip_type||'0',vip_token:obj.vip_token||''};$('ckSubmit').disabled=true;$('ckSubmit').textContent='登录中…';try{const r=await post('/login/cookie',body);if(r&&r.success&&r.logged){$('loginM').style.display='none';S.logged=true;toast('✅ 登录成功，欢迎 '+(r.nickname||'用户')+'！','ok');await loadStatus()}else{toast(r.error||'登录失败','err')}}catch(e){toast('登录失败: '+e.message,'err')}finally{$('ckSubmit').disabled=false;$('ckSubmit').textContent='登录'}};
const themeKey='kgTheme';const themeMeta={pink:{icon:'🌸',name:'甜美粉系'},mac:{icon:'🍎',name:'macOS 精设'}};
function applyTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem(themeKey,t)}catch(e){}const b=$('themeB');if(b){b.textContent=themeMeta[t].icon;b.title='当前：'+themeMeta[t].name+' · 点击切换'}}
$('themeB').onclick=()=>{const cur=document.documentElement.dataset.theme;applyTheme(cur==='mac'?'pink':'mac')};
(function(){let t='pink';try{t=localStorage.getItem(themeKey)||'pink'}catch(e){}applyTheme(t)})();
let vipCool=0,vipCoolT=null;
$('vipB').onclick=async()=>{if(!S.logged){toast('请先登录','err');return}const now=Date.now();if(now<vipCool){toast('操作太频繁，稍等几秒再试','err');return}$('vipB').disabled=true;$('vipT').textContent='领取中...';try{const r=await(await fetch('/api/vip/claim',{method:'POST'})).json();if(r.cooldown&&r.coolSeconds){vipCool=now+r.coolSeconds*1000;toast(r.error||'操作过于频繁，请稍后再试','err');setVipCool(r.coolSeconds)}else if(r.alreadyClaimed){toast(r.message||'已领取','ok');await loadStatus()}else if(r.success){toast('🎉 VIP领取成功！','ok');await loadStatus();const t=$('vipT');if(S.logged)t.textContent='剩余'+(r.dayVip?(r.dayVip.remain_vip_hour||0):'');}else if(r.cooldown){vipCool=now+(r.coolSeconds||6)*1000;toast(r.error||'操作太频繁，稍后再试','err');setTimeout(()=>setVipCool(0),0)}else{toast(r.error||'领取失败，请稍后再试','err');vipCool=now+5000;setVipCool(0)}}catch(e){toast('领取失败,请稍后再试','err');vipCool=now+5000;}finally{if(S.logged){const t=$('vipT');if(t&&t.textContent.indexOf('剩余')<0)t.textContent='领取VIP';}$('vipB').disabled=false}};
function setVipCool(sec){if(vipCoolT)clearInterval(vipCoolT);if(sec>0){const b=$('vipB');let n=sec;b.disabled=true;vipCoolT=setInterval(()=>{n--;if(n<=0){clearInterval(vipCoolT);vipCoolT=null;b.disabled=false;$('vipT').textContent='领取VIP'}else{$('vipT').textContent=n+'s'}},1000)}}
async function loadStatus(){try{const st=await api('/api/status');if(st.logged){S.logged=true;$('loginB').style.display='none';$('uBox').style.display='flex';$('uNk').textContent=st.nickname}else{S.logged=false;$('loginB').style.display='flex';$('uBox').style.display='none';$('vipB').style.display='none'}if(S.logged){const vip=await api('/api/vip/status');if(vip.vip){$('vipC').style.display='';$('vipB').style.display='flex';$('vipT').textContent='剩余'+(vip.remainHours||0)+'h'}else{$('vipC').style.display='none';$('vipB').style.display='flex';$('vipT').textContent='领取VIP'}}}catch(e){}}
async function loadRecommend(){
  $('p-recommend').innerHTML='<div class="ld"><div class="spin"></div>AI 正在分析你的听歌偏好...</div>';
  try{
    const r=await api('/api/recommend');
    if(!r.top_singers?.length){
      $('p-recommend').innerHTML='<div class="rec-header"><div class="rec-title">'+(r.reason||'播放记录太少')+'</div><div class="rec-desc">总播放: '+(r.total_plays||0)+' 次</div></div><div class="empty"><div class="empty-i">🎧</div><div class="empty-t">多听几首歌，AI 会为你推荐</div></div>';
      return;
    }
    let html='<div class="rec-header"><div class="rec-title">'+(r.reason||'为你推荐')+'</div><div class="rec-desc">总播放: '+(r.total_plays||0)+' 次 · 收听 '+(r.total_listen_min||0)+' 分钟</div><div class="rec-tags">'+(r.top_singers||[]).map(s=>'<span class="rec-tag active">'+s.vector_key+' '+(s.score?.toFixed(1)||'')+'分</span>').join('')+(r.language_prefs||[]).map(l=>'<span class="rec-tag">'+l.vector_key+'</span>').join('')+'</div></div>';
    $('p-recommend').innerHTML=html+'<div id="rec-songs"><div class="ld"><div class="spin"></div>加载中...</div></div>';
    const validKws=(r.search_keywords||[]).filter(k=>k&&k!=='Test'&&k!=='Unknown'&&k.length>1);
    if(validKws.length>0){
      const sr=await api('/api/search?keyword='+encodeURIComponent(validKws[0])+'&pagesize=20');
      if(sr.data?.length){renderSongs(sr.data,$('rec-songs'));$('rec-songs').insertAdjacentHTML('beforebegin','<div class="rec-tags"><span class="rec-tag active">🎯 基于 '+validKws[0]+' 推荐</span></div>')}
      else{$('rec-songs').innerHTML='<div class="empty"><div class="empty-t">未找到相关歌曲</div></div>'}
    }else{$('rec-songs').innerHTML='<div class="empty"><div class="empty-t">暂无推荐关键词</div></div>'}
  }catch(e){$('p-recommend').innerHTML='<div class="empty"><div class="empty-i">🤖</div><div class="empty-t">推荐加载失败: '+e.message+'</div></div>'}
}
async function loadFavorites(){
  $('p-favorites').innerHTML='<div class="ld"><div class="spin"></div>加载中...</div>';
  try{
    const r=await api('/api/favorites');
    if(r.data?.length){
      const songs=r.data.map(f=>({hash:f.hash,songname:f.songname,singername:f.singername,album_name:f.album_name||'',duration:f.duration||0,mixsongid:f.mixsongid||0,album_info:{heat:f.heat||0}}));
      S.favSongs=songs;
      $('p-favorites').innerHTML='<div class="count" style="color:var(--text2);font-size:12px;margin-bottom:10px">共 '+r.total+' 首收藏</div>'+
        songs.map((s,i)=>'<div class="sitem" data-i="'+i+'" onclick="playFav('+i+')"><div class="sidx"><span class="num">'+(i+1)+'</span><span class="eq"><i></i><i></i><i></i></span></div><div class="scov">🎵</div><div class="snfo"><div class="snm">'+esc(s.songname)+'</div><div class="sar">'+esc(s.singername)+'</div><div class="sbdg"></div></div><div class="sact"><button class="ibtn" onclick="event.stopPropagation();playFav('+i+')">▶</button><button class="ibtn fav on" onclick="event.stopPropagation();unfav('+i+')" title="取消收藏">❤</button></div></div>').join('');
    }else{$('p-favorites').innerHTML='<div class="empty"><div class="empty-i">❤️</div><div class="empty-t">还没有收藏</div></div>'}
  }catch(e){$('p-favorites').innerHTML='<div class="empty"><div class="empty-i">❤️</div><div class="empty-t">加载失败</div></div>'}
}
async function playFav(i){
  if(!S.favSongs?.[i])return;
  S.songs=S.favSongs;S.idx=i;
  const s=S.songs[i];$('player').style.display='';
  $('pNm').textContent=s.songname;$('pAr').textContent=s.singername;$('playB').textContent='⏳';
  $('fpNm').textContent=s.songname;$('fpAr').textContent=s.singername;
  $('pCov').classList.remove('on');$('fpCov').classList.remove('on');
  try{
    const r=await api('/api/song/url?hash='+s.hash+'&album_audio_id='+(s.mixsongid||'')+'&songname='+encodeURIComponent(s.songname||'')+'&singername='+encodeURIComponent(s.singername||''));
    if(!r.url){toast('获取播放链接失败','err');$('playB').textContent='▶';return}
    aud.src='/api/stream?url='+encodeURIComponent(r.url)+'&hash='+(r.hash||r.resolved?.hash||s.hash)+'&name='+encodeURIComponent(s.songname+' - '+s.singername);
    await aud.play();S.playing=true;$('playB').textContent='⏸';$('fpPlay').textContent='⏸';
    $('pCov').classList.add('on');$('fpCov').classList.add('on');initViz();loadLyric(s.hash,'');recordPlay(s);
  }catch(e){toast('播放失败: '+e.message,'err');$('playB').textContent='▶'}
}
async function unfav(i){
  const s=S.favSongs?.[i];if(!s)return;
  try{const r=await(await fetch('/api/favorite',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({song:s,action:'remove'})})).json();
    if(r.success){S.favs=S.favs.filter(f=>f.hash!==s.hash);toast('已取消收藏','ok');loadFavorites()}}catch(e){toast('操作失败','err')}
}
async function loadHistory(){
  $('p-history').innerHTML='<div class="ld"><div class="spin"></div>加载中...</div>';
  try{
    const r=await api('/api/history?limit=50');
    if(r.data?.length){
      const songs=r.data.map(h=>({hash:h.hash,songname:h.songname,singername:h.singername,album_name:h.album_name||'',duration:h.duration||0,mixsongid:h.mixsongid||0,play_count:h.play_count||1,album_info:{heat:h.heat||0},_time:h.play_time}));
      S.histSongs=songs;
      $('p-history').innerHTML='<div class="count" style="color:var(--text2);font-size:12px;margin-bottom:10px">最近 '+r.total+' 首歌 · 已合并重复播放</div>'+
        songs.map((s,i)=>'<div class="sitem" data-i="'+i+'" onclick="playHist('+i+')"><div class="sidx"><span class="num">'+(i+1)+'</span><span class="eq"><i></i><i></i><i></i></span></div><div class="scov">🎵</div><div class="snfo"><div class="snm">'+esc(s.songname)+'</div><div class="sar">'+esc(s.singername)+'</div><div class="sbdg">'+(s.play_count>1?'<span class="badge hq">播放'+s.play_count+'次</span>':'')+'</div></div><div class="sact"><button class="ibtn" onclick="event.stopPropagation();playHist('+i+')">▶</button></div></div>').join('');
    }else{$('p-history').innerHTML='<div class="empty"><div class="empty-i">📜</div><div class="empty-t">还没有播放记录</div></div>'}
  }catch(e){$('p-history').innerHTML='<div class="empty"><div class="empty-i">📜</div><div class="empty-t">加载失败</div></div>'}
}
async function playHist(i){
  if(!S.histSongs?.[i])return;
  const s=S.histSongs[i];S.songs=S.histSongs;S.idx=i;
  const savedPos=parseFloat(localStorage.getItem('lastPos:'+s.hash)||0);
  let startPos=0;
  if(savedPos>10&&aud.currentTime!==savedPos){if(confirm('继续播放上次的位置 '+fmt(savedPos)+' 吗？'))startPos=savedPos}
  $('player').style.display='';$('pNm').textContent=s.songname;$('pAr').textContent=s.singername;$('playB').textContent='⏳';
  $('fpNm').textContent=s.songname;$('fpAr').textContent=s.singername;
  $('pCov').classList.remove('on');$('fpCov').classList.remove('on');updPlay(i);
  try{
    const r=await api('/api/song/url?hash='+s.hash+'&album_audio_id='+(s.mixsongid||'')+'&songname='+encodeURIComponent(s.songname||'')+'&singername='+encodeURIComponent(s.singername||''));
    if(!r.url){toast('获取播放链接失败','err');$('playB').textContent='▶';return}
    aud.src='/api/stream?url='+encodeURIComponent(r.url)+'&hash='+(r.hash||r.resolved?.hash||s.hash)+'&name='+encodeURIComponent(s.songname+' - '+s.singername);
    if(startPos>0)aud.currentTime=startPos;
    await aud.play();S.playing=true;$('playB').textContent='⏸';$('fpPlay').textContent='⏸';
    $('pCov').classList.add('on');$('fpCov').classList.add('on');initViz();loadLyric(s.hash,'');recordPlay(s);
  }catch(e){toast('播放失败: '+e.message,'err');$('playB').textContent='▶'}
}
$('srchB').onclick=()=>search($('kw').value);$('kw').onkeydown=e=>{if(e.key==='Enter')search($('kw').value)};
loadStatus();window.onresize=()=>{const c=$('viz');if(c){c.width=innerWidth;c.height=innerHeight}};
</script>
