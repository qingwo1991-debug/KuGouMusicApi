<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的歌单</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: 24px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    .card { background: #fff; border-radius: 16px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); margin-bottom: 16px; }
    h1 { font-size: 20px; color: #1e3c72; margin-bottom: 6px; }
    .sub { color: #888; font-size: 13px; margin-bottom: 16px; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    button {
      border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px;
      cursor: pointer; background: #1e3c72; color: #fff;
    }
    button.ghost { background: #eef2ff; color: #1e3c72; }
    button:hover { opacity: .9; }
    .list { list-style: none; }
    .list li {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 6px; border-bottom: 1px solid #f0f0f0; gap: 10px; cursor: pointer;
    }
    .list li:hover { background: #fafbff; }
    .pl-name { font-size: 15px; color: #333; font-weight: 600; }
    .pl-meta { font-size: 12px; color: #999; margin-top: 2px; }
    .tag { font-size: 12px; color: #2a5298; }
    .songs { margin-top: 12px; }
    .song { display: flex; justify-content: space-between; padding: 8px 4px; border-bottom: 1px dashed #f0f0f0; font-size: 13px; gap: 8px; }
    .song .s { color: #555; }
    .song .a { color: #999; }
    .status { font-size: 13px; color: #555; margin-top: 10px; min-height: 18px; }
    .status.err { color: #dc2626; }
    .status.ok { color: #16a34a; }
    .back { margin-top: 16px; }
    .back a { color: #2a5298; text-decoration: none; font-size: 13px; }
    .empty { color: #999; text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>我的歌单</h1>
      <p class="sub">需要先登录酷狗账号（扫码登录最方便）</p>
      <div class="toolbar">
        <button id="loadBtn" class="ghost">刷新歌单</button>
        <button id="syncBtn">同步到本地</button>
      </div>
      <div class="status" id="status"></div>
      <ul class="list" id="list">
        <li class="empty">加载中…</li>
      </ul>
      <div class="back"><a href="./login_qr.html">去扫码登录</a> · <a href="./account.html">账号管理</a> · <a href="./">返回首页</a></div>
    </div>
    <div class="card" id="songsCard" style="display:none">
      <h1 id="songsTitle" style="font-size:16px"></h1>
      <div class="songs" id="songs"></div>
    </div>
  </div>

  <script>
    function setStatus(t, cls) {
      const el = document.getElementById('status');
      el.textContent = t || '';
      el.className = 'status' + (cls ? ' ' + cls : '');
    }

    function pickPlaylists(body) {
      const d = (body && body.data) || {};
      const arr = d.info || d.lists || d.list || [];
      return arr
        .map(function (p) {
          return {
            id: p.global_collection_id || p.listid || p.list_id || String(p.specialid || ''),
            name: p.listname || p.name || p.title || '未命名歌单',
            count: p.songcount || p.song_count || p.count || 0,
          };
        })
        .filter(function (p) { return p.id; });
    }

    async function loadPlaylists() {
      const ul = document.getElementById('list');
      setStatus('加载歌单中…');
      try {
        const r = await fetch('/user/playlist', { credentials: 'same-origin' }).then(function (res) { return res.json(); });
        if (!r || !r.data) {
          setStatus('未登录或接口返回异常：' + JSON.stringify(r).slice(0, 120), 'err');
          ul.innerHTML = '<li class="empty">请先登录</li>';
          return;
        }
        const pls = pickPlaylists(r);
        if (!pls.length) {
          setStatus('没有歌单（或登录已失效）', 'err');
          ul.innerHTML = '<li class="empty">暂无歌单</li>';
          return;
        }
        setStatus('共 ' + pls.length + ' 个歌单', 'ok');
        ul.innerHTML = '';
        pls.forEach(function (p) {
          const li = document.createElement('li');
          li.innerHTML = '<div><div class="pl-name">' + p.name + '</div><div class="pl-meta">' + p.count + ' 首 · ' + p.id + '</div></div><span class="tag">查看歌曲 ›</span>';
          li.onclick = function () { loadSongs(p); };
          ul.appendChild(li);
        });
      } catch (e) {
        setStatus('加载失败：' + e.message, 'err');
      }
    }

    async function loadSongs(pl) {
      const card = document.getElementById('songsCard');
      const box = document.getElementById('songs');
      document.getElementById('songsTitle').textContent = pl.name;
      box.innerHTML = '<div class="empty">加载歌曲中…</div>';
      card.style.display = 'block';
      try {
        const r = await fetch('/playlist/track/all?id=' + encodeURIComponent(pl.id) + '&pagesize=200', { credentials: 'same-origin' }).then(function (res) { return res.json(); });
        const d = (r && r.data) || {};
        const arr = d.info || d.lists || d.songs || [];
        if (!arr.length) { box.innerHTML = '<div class="empty">没有歌曲</div>'; return; }
        box.innerHTML = '';
        arr.forEach(function (s, i) {
          const row = document.createElement('div');
          row.className = 'song';
          row.innerHTML = '<span class="s">' + (i + 1) + '. ' + (s.songname || s.SongName || s.filename || '') + ' — ' + (s.singername || s.SingerName || '') + '</span><span class="a">' + (s.album_name || s.AlbumName || '') + '</span>';
          box.appendChild(row);
        });
      } catch (e) {
        box.innerHTML = '<div class="empty">加载失败：' + e.message + '</div>';
      }
    }

    async function syncToLocal() {
      setStatus('同步中（歌单多时可能需要一会儿）…');
      document.getElementById('syncBtn').disabled = true;
      try {
        const r = await fetch('/playlist/sync', { credentials: 'same-origin' }).then(function (res) { return res.json(); });
        if (r.code === 0) {
          setStatus('同步完成：' + r.count + ' 个歌单，' + r.totalTracks + ' 首歌，已保存到 .kugou/playlists.json', 'ok');
        } else {
          setStatus('同步失败：' + (r.error || JSON.stringify(r)), 'err');
        }
      } catch (e) {
        setStatus('同步失败：' + e.message, 'err');
      } finally {
        document.getElementById('syncBtn').disabled = false;
      }
    }

    document.getElementById('loadBtn').onclick = loadPlaylists;
    document.getElementById('syncBtn').onclick = syncToLocal;
    loadPlaylists();
  </script>
</body>
</html>
