# KuGouMusic API: HTTP 跳转 + HTTPS 反代（不加密码，复用现有 dsh 证书）
server {
    listen 8098;
    server_name localhost;
    server_tokens off;
    return 308 https://192.168.1.15:8450$request_uri;
}

server {
    listen 8450 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/dsh.crt;
    ssl_certificate_key /etc/nginx/ssl/dsh.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5301;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }
}
